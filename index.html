<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgotten Explorers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
#stage{position:relative;overflow:hidden;background:#000;border-radius:.5em;box-shadow:0 0 2em rgba(80,120,255,.15)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:.55em 1.2em;background:#ffd34d;color:#1b1530;cursor:pointer;box-shadow:0 .22em 0 #b8891a;transition:transform .05s}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #b8891a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.4)}
.btn.blue{background:#6fd3ff;box-shadow:0 .22em 0 #2a8fbf}
.btn.red{background:#ff8a7a;box-shadow:0 .22em 0 #b8463a}
.btn.big{font-size:1.25em;padding:.6em 1.6em}
#toggles{position:absolute;top:.5em;right:.5em;display:flex;gap:.4em;z-index:7}
#toggles .btn{padding:.3em .75em;font-size:.8em}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center;z-index:8;padding:1em}
#title h1{font-size:2.5em;line-height:1.05;text-shadow:0 .1em .5em #000;letter-spacing:.01em}
#title h1 span{color:#ffd34d}
#title p{opacity:.85;text-shadow:0 .1em .3em #000}
#title .row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:.4em}
#dialog{position:absolute;left:2%;right:2%;top:2.6em;background:rgba(10,12,35,.9);border:2px solid rgba(255,255,255,.22);border-radius:.8em;padding:.65em 1em .7em;z-index:6;display:none;cursor:pointer}
#dialog .who{font-weight:900;color:#ffd34d;margin-bottom:.2em;font-size:.9em;letter-spacing:.04em;text-transform:uppercase}
#dialog .txt{line-height:1.42;min-height:2.84em}
#dialog .acts{display:flex;gap:.6em;justify-content:flex-end;margin-top:.45em;flex-wrap:wrap}
#controls{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 3% 3%;z-index:5;pointer-events:none}
#controls .pad{display:flex;gap:.7em;pointer-events:auto}
#controls button{width:3.6em;height:3.6em;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;font-size:1.05em;font-weight:900;touch-action:none;font-family:inherit}
#controls button.on{background:rgba(255,211,77,.5)}
#albumBtn{position:absolute;top:.5em;left:.5em;z-index:7;display:none;padding:.35em .9em;font-size:.9em}
#album{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at center,#7b4a2a 0%,#5a3319 70%,#3d220f 100%);padding:16px 16px 40px;font-size:16px}
#album .ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto 6px}
#album h2{font-size:1.6em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#album .ahead p{opacity:.85;margin-top:4px;max-width:620px}
#album .abtns{display:flex;gap:8px}
#album h3{max-width:1100px;margin:22px auto 10px;font-size:1.15em;color:#ffd34d;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#album .agrid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px}
.pol{position:relative;display:block;width:100%;background:#fbfaf5;padding:8px 8px 0;border:0;box-shadow:0 8px 18px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));cursor:pointer;font:inherit;color:#2b2b3a;transition:transform .15s}
button.pol:hover,button.pol:focus-visible{transform:rotate(0deg) scale(1.04);outline:none}
.pol img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.pol span{display:block;padding:8px 2px 10px;font-family:"Comic Sans MS","Marker Felt","Chalkboard SE",cursive;font-size:15px;text-align:center}
.pol::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:18px;margin-left:-27px;background:rgba(255,240,170,.75);transform:rotate(-4deg)}
.pol em,#albumDetail h2 em{font-style:normal;font-size:12px;font-weight:800;background:#ffd34d;color:#1b1530;border-radius:99px;padding:2px 8px;vertical-align:middle}
.pol em{position:absolute;top:12px;right:12px;z-index:1}
.pol.mine{cursor:default}
#apollo{position:fixed;inset:0;z-index:80;display:none;justify-content:center;align-items:flex-start;background:rgba(5,6,15,.82);padding:14px;font-size:16px;overflow-y:auto}
#apollo .acard{max-width:640px;width:100%;background:#1a1530;border:2px solid #6fd3ff;border-radius:18px;padding:18px 20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.6);margin:auto}
#apollo img{display:block;width:100%;max-height:40vh;border-radius:10px;margin-bottom:14px;aspect-ratio:16/9;object-fit:contain;background:#05060f}
#apollo h2{color:#6fd3ff;font-size:1.35em;margin-bottom:8px}
#apollo p{line-height:1.55}
#apollo .afoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
#apollo a{color:#ffd34d;font-size:13px}
#albumIntro{position:fixed;inset:0;z-index:70;display:none;justify-content:center;align-items:center;background:rgba(10,8,20,.78);padding:16px;font-size:16px}
#albumIntro .icard{max-width:560px;width:100%;background:#1a1530;border:2px solid #ffd34d;border-radius:18px;padding:24px 22px 26px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#albumIntro .ipol{display:flex;justify-content:center;margin-bottom:18px}
#albumIntro .ipol img{width:30%;aspect-ratio:16/9;object-fit:cover;border:6px solid #fbfaf5;border-bottom-width:16px;box-shadow:0 6px 14px rgba(0,0,0,.5);margin:0 -10px}
#albumIntro .ipol img:nth-child(1){transform:rotate(-8deg)}#albumIntro .ipol img:nth-child(2){transform:rotate(2deg) translateY(-6px);z-index:1}#albumIntro .ipol img:nth-child(3){transform:rotate(9deg)}
#albumIntro h2{font-size:1.45em;color:#ffd34d;margin-bottom:10px;line-height:1.2}
#albumIntro p{line-height:1.55;margin-bottom:20px;opacity:.95}
.pol span small{display:block;font-family:system-ui,sans-serif;font-size:11.5px;font-weight:700;color:#2a8fbf;margin-top:3px}
#albumDetail{position:fixed;inset:0;z-index:60;display:none;justify-content:center;align-items:flex-start;overflow-y:auto;background:rgba(10,8,20,.72);padding:16px;font-size:16px}
#albumDetail .dcard{width:100%;max-width:720px;background:#1a1530;border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:16px 18px 22px;margin:auto 0}
#albumDetail .dtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
#albumDetail .nav{display:flex;align-items:center;gap:8px;opacity:.95}
#albumDetail .btn{padding:.4em .9em}
#albumDetail .pol.big{--r:-1.2deg;cursor:default;max-width:560px;margin:8px auto 18px}
#albumDetail h2{font-size:1.45em;margin-bottom:10px}
#albumDetail .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#albumDetail .chips b{font-weight:600;font-size:13.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 10px}
#albumDetail p{line-height:1.6;font-size:16.5px}
#albumDetail a{display:inline-block;margin-top:14px;color:#6fd3ff;font-size:14px;word-break:break-all}
#dialog.bottom{top:auto;bottom:3%}
@media (orientation:portrait){
  #dialog,#dialog.bottom{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin-top:.6em}
  #title h1{font-size:1.8em}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="title">
      <h1 data-k="title1"></h1>
      <p data-k="subtitle"></p>
      <div class="row">
        <button class="btn big" id="startBtn" data-k="startBtn"></button>
      </div>
      <div class="row">
        <button class="btn ghost sndBtn"></button>
        <button class="btn ghost langBtn"></button>
      </div>
    </div>
    <div id="toggles" style="display:none">
      <button class="btn ghost sndBtn"></button>
      <button class="btn ghost langBtn"></button>
    </div>
    <button class="btn" id="albumBtn" data-k="albumBtn"></button>
    <div id="controls">
      <div class="pad"><button id="cL">◀</button><button id="cR">▶</button></div>
      <div class="pad"><button id="cJ">▲</button></div>
    </div>
  </div>
  <div id="dialog"><div class="who"></div><div class="txt"></div><div class="acts"></div></div>
</div>
<div id="album"></div>
<div id="albumDetail"></div>
<div id="albumIntro"></div>
<div id="apollo"></div>

<script>
"use strict";
/* =========================================================
   TEXTS (EN / PT)
   ========================================================= */
const TX = {
  title1:{en:'Forgotten <span>Explorers</span>',pt:'Exploradores <span>Esquecidos</span>'},
  subtitle:{en:'A space mission to bring forgotten stories back to life',pt:'Uma missão espacial para trazer histórias esquecidas de volta à vida'},
  startBtn:{en:'▶ Start',pt:'▶ Iniciar'},
  sndOn:{en:'🔊 Sound',pt:'🔊 Som'}, sndOff:{en:'🔇 Sound',pt:'🔇 Som'},
  langBtn:{en:'🌐 EN → PT',pt:'🌐 PT → EN'},
  next:{en:'Next ▶',pt:'Avançar ▶'},
  start:{en:"Let's go! ▶",pt:'Vamos lá! ▶'},
  takePhoto:{en:'📷 Take photo',pt:'📷 Tirar foto'},
  again:{en:'↺ Play again',pt:'↺ Jogar de novo'},
  goMoon:{en:'🌕 Moon',pt:'🌕 Lua'}, goMars:{en:'🔴 Mars',pt:'🔴 Marte'},
  yes:{en:'YES',pt:'SIM'}, no:{en:'NO',pt:'NÃO'},
  energy:{en:'ENERGY',pt:'ENERGIA'},
  oops:{en:'Oops!',pt:'Opa!'}, ouch:{en:'Ouch!',pt:'Ai!'},
  platHint:{en:'Arrows / A D: move   ·   Space / W: jump',pt:'Setas / A D: mover   ·   Espaço / W: pular'},
  photoHint:{en:'Frame your photo! Drag the scene to move the camera and use − / + to zoom. Then take the picture!',pt:'Enquadre sua foto! Arraste a cena para mover a câmera e use − / + para dar zoom. Depois, tire a foto!'},
  zoomIn:{en:'＋',pt:'＋'}, zoomOut:{en:'−',pt:'−'},
  nISS:{en:'ISS',pt:'ISS'},
  nRadio:{en:'📻 Mission Control · rocket radio',pt:'📻 Controle da Missão · rádio do foguete'},
  radio1:{en:"Kssh… This is Mission Control, speaking through your rocket's radio! The rocket will now fly back to orbit and wait for you up there. When your mission is done, just call it and it will come down to pick you up. Good luck, astronaut!",
          pt:'Kssh… Aqui é o Controle da Missão, falando pelo rádio do seu foguete! O foguete vai voltar para a órbita e esperar por você lá em cima. Quando terminar a missão, é só chamar que ele desce para te buscar. Boa sorte, astronauta!'},
  radio2:{en:'Kssh… Signal received! Your rocket is leaving orbit and coming down to pick you up.',pt:'Kssh… Sinal recebido! Seu foguete está saindo da órbita e descendo para te buscar.'},
  callHint:{en:'Mission complete here! Use the radio to call your rocket back from orbit.',pt:'Missão cumprida por aqui! Use o rádio para chamar seu foguete de volta da órbita.'},
  callRocket:{en:'📡 Call the rocket',pt:'📡 Chamar o foguete'},
  learnMore:{en:'📖 Learn more',pt:'📖 Saiba mais'},
  apTitle:{en:'How Apollo 11 did it',pt:'Como a Apollo 11 fez isso'},
  apText:{en:'On Apollo 11, in July 1969, three astronauts flew to the Moon, but only two of them landed. Neil Armstrong and Buzz Aldrin went down to the surface in the Lunar Module Eagle, while Michael Collins stayed in lunar orbit in the Command Module, Columbia, waiting for them. After 21 hours and 36 minutes on the Moon, the top part of Eagle lifted off and docked with Columbia, and the three astronauts flew home together. The bottom part of Eagle stayed behind on the Moon. Your rocket works the same way: it waits in orbit until you call!',
          pt:'Na Apollo 11, em julho de 1969, três astronautas viajaram até a Lua, mas só dois pousaram. Neil Armstrong e Buzz Aldrin desceram até a superfície no Módulo Lunar Eagle, enquanto Michael Collins ficou em órbita da Lua no Módulo de Comando, o Columbia, esperando por eles. Depois de 21 horas e 36 minutos na Lua, a parte de cima do Eagle decolou e se acoplou ao Columbia, e os três voltaram juntos para casa. A parte de baixo do Eagle ficou na Lua. Seu foguete funciona do mesmo jeito: ele espera em órbita até você chamar!'},
  apOk:{en:'Got it! 👍',pt:'Entendi! 👍'},
  apSrc:{en:'Source: NASA · NSSDCA, Apollo 11 Lunar Module',pt:'Fonte: NASA · NSSDCA, Módulo Lunar da Apollo 11'},
  apOrbit:{en:'Columbia · Michael Collins (in orbit)',pt:'Columbia · Michael Collins (em órbita)'},
  apSurface:{en:'Eagle · Armstrong & Aldrin (on the Moon)',pt:'Eagle · Armstrong e Aldrin (na Lua)'},
  issDock:{en:'Docking complete! Welcome aboard the International Space Station, astronaut. Your rocket is refueled and ready to go.',pt:'Acoplagem concluída! Bem-vindo a bordo da Estação Espacial Internacional, astronauta. Seu foguete foi reabastecido e está pronto para partir.'},
  newMoon:{en:'🛰️ NEW MISSION: fly to the Moon! Some old explorers are still waiting there to share their stories.',pt:'🛰️ NOVA MISSÃO: voe até a Lua! Alguns velhos exploradores ainda esperam por lá para contar suas histórias.'},
  newMars:{en:'🛰️ NEW MISSION: head to Mars! A few brave rovers are waiting for you on the Red Planet.',pt:'🛰️ NOVA MISSÃO: siga para Marte! Alguns rovers corajosos esperam por você no Planeta Vermelho.'},
  launch:{en:'Launch! 🚀',pt:'Decolar! 🚀'},
  giant:{en:'GIANT DUST STORM! Keep tapping!',pt:'TEMPESTADE GIGANTE! Continue tocando!'},
  choose:{en:'Where do you want to go first, astronaut?',pt:'Para onde você quer ir primeiro, astronauta?'},
  chooseNext:{en:'Welcome back to Earth! One more world is waiting for you. Ready?',pt:'Bem-vindo de volta à Terra! Mais um mundo está esperando por você. Pronto?'},
  thanks:{en:'Thanks for playing! But the adventure is not over: 14 real NASA explorers are waiting in the full album, with your own photos and true stories from their missions. Open it and meet them all!',pt:'Obrigado por jogar! Mas a aventura não acabou: 14 exploradores reais da NASA esperam por você no álbum completo, com as suas fotos e histórias verdadeiras das missões. Abra o álbum e conheça todos eles!'},
  nMission:{en:'Mission',pt:'Missão'},
  nLRV:{en:'LRV',pt:'LRV'}, nEagle:{en:'Eagle',pt:'Eagle'}, nSoj:{en:'Sojourner',pt:'Sojourner'},
  nOppy:{en:'Oppy',pt:'Oppy'}, nSpirit:{en:'Spirit',pt:'Spirit'},
  capLRV:{en:'LRV · Moon',pt:'LRV · Lua'},
  capEagle:{en:'Eagle · Apollo 11',pt:'Eagle · Apollo 11'},
  capMars:{en:'Sojourner, Spirit & Oppy · Mars',pt:'Sojourner, Spirit e Oppy · Marte'},

  intro1:{en:'Every space mission leaves something behind! Some objects are abandoned because their work is done, they stop working, or there is no way to bring them back home.',
          pt:'Toda missão espacial deixa algo para trás! Alguns objetos são abandonados porque seu trabalho terminou, porque pararam de funcionar ou porque não há como trazê-los de volta para casa.'},
  intro2:{en:"Your mission is to find these forgotten explorers, take pictures, and discover their stories. Let's bring their memories back to life!",
          pt:'Sua missão é encontrar esses exploradores esquecidos, tirar fotos e descobrir suas histórias. Vamos trazer as memórias deles de volta à vida!'},

  lrv1:{en:"Well, hello there, little astronaut! I'm the Lunar Roving Vehicle, but you can call me LRV! A long time ago, I explored the Moon with the Apollo astronauts.",
        pt:'Ora, olá, pequeno astronauta! Eu sou o Veículo de Exploração Lunar, mas pode me chamar de LRV! Há muito tempo, explorei a Lua com os astronautas da Apollo.'},
  lrv2:{en:'I helped them travel across the lunar surface, explore new places, and collect samples for scientists back on Earth.',
        pt:'Eu os ajudei a viajar pela superfície lunar, explorar novos lugares e coletar amostras para os cientistas lá na Terra.'},
  lrv3:{en:'I had many exciting adventures, but my mission is over now. My batteries ran out, and I can no longer move.',
        pt:'Vivi muitas aventuras emocionantes, mas minha missão já terminou. Minhas baterias acabaram e não consigo mais me mover.'},
  lrv4:{en:'But wait… maybe you can help me with one last little adventure! Could you find a way to give me some energy?',
        pt:'Mas espere… talvez você possa me ajudar em uma última pequena aventura! Você consegue encontrar um jeito de me dar um pouco de energia?'},
  moonGame:{en:'Jump across craters, dodge rocks, and explore the Moon! Collect the lost battery to help bring the Lunar Rover back to life. Watch your steps, astronaut!',
        pt:'Pule as crateras, desvie das rochas e explore a Lua! Pegue a bateria perdida para trazer o Veículo Lunar de volta à vida. Cuidado onde pisa, astronauta!'},
  lrv5:{en:"Wow! You did it! I feel full of energy again! Thank you, little astronaut! Now, hop on and let's explore the Moon together. There are still so many things to see!",
        pt:'Uau! Você conseguiu! Estou cheio de energia de novo! Obrigado, pequeno astronauta! Agora suba e vamos explorar a Lua juntos. Ainda há tantas coisas para ver!'},
  lrv6:{en:"I'm running out of energy again. I guess this is where our journey ends. I've completed my mission, and it's time for me to rest.",
        pt:'Minha energia está acabando de novo. Acho que nossa viagem termina aqui. Cumpri minha missão e é hora de descansar.'},
  lrv7:{en:"Thank you for visiting me and listening to my story! It's nice to know my adventures won't be forgotten. Safe travels, little astronaut!",
        pt:'Obrigado por me visitar e ouvir minha história! É bom saber que minhas aventuras não serão esquecidas. Boa viagem, pequeno astronauta!'},
  eagle1:{en:"Oh! A visitor! Welcome to the Moon, little astronaut! I'm the Eagle, or, more precisely, the descent stage of the Apollo 11 Lunar Module.",
        pt:'Oh! Uma visita! Bem-vindo à Lua, pequeno astronauta! Eu sou o Eagle, ou, mais precisamente, o estágio de descida do Módulo Lunar da Apollo 11.'},
  eagle2:{en:'I brought the first astronauts to the Moon back in 1969. It was an unforgettable mission! I helped Neil Armstrong and Buzz Aldrin reach the lunar surface. They explored the Moon, collected samples, and made history!',
        pt:'Eu trouxe os primeiros astronautas à Lua em 1969. Foi uma missão inesquecível! Ajudei Neil Armstrong e Buzz Aldrin a chegar à superfície lunar. Eles exploraram a Lua, coletaram amostras e fizeram história!'},
  eagle3:{en:'But the Lunar Module had two parts. The upper part carried the astronauts back to orbit, while I stayed here on the Moon. And here I am, still resting on the lunar surface after all these years!',
        pt:'Mas o Módulo Lunar tinha duas partes. A parte de cima levou os astronautas de volta à órbita, enquanto eu fiquei aqui na Lua. E aqui estou, ainda descansando na superfície lunar depois de todos esses anos!'},
  eagle4:{en:"I may be just an old piece of spacecraft now, but I was once part of a giant leap for humankind! Would you take a picture of me? I'd love to be remembered by future explorers!",
        pt:'Posso ser só um pedaço velho de nave espacial agora, mas um dia fiz parte de um grande salto para a humanidade! Você tira uma foto minha? Eu adoraria ser lembrado pelos futuros exploradores!'},
  eagle5:{en:'Thank you for visiting and listening to my story! Now, my adventures can live on through your photographs. Keep exploring, little astronaut. The universe is full of stories waiting to be discovered.',
        pt:'Obrigado por visitar e ouvir minha história! Agora minhas aventuras podem continuar vivas por meio das suas fotografias. Continue explorando, pequeno astronauta. O universo está cheio de histórias esperando para serem descobertas.'},

  soj1:{en:"Hello, little explorer! I'm Sojourner, the first rover ever to explore Mars! A long time ago, scientists built me with one big mission: to help answer a very important question about this mysterious red planet.",
        pt:'Olá, pequeno explorador! Eu sou o Sojourner, o primeiro rover a explorar Marte! Há muito tempo, os cientistas me construíram com uma grande missão: ajudar a responder a uma pergunta muito importante sobre este misterioso planeta vermelho.'},
  q:{en:'Did Mars have liquid water in the past?',pt:'Marte já teve água líquida no passado?'},
  soj2:{en:"What's the answer, my friend?",pt:'Qual é a resposta, meu amigo?'},
  wrong:{en:'Hmm, not quite! Look at the dry riverbeds and the rocks around here… Want to try again?',pt:'Hmm, não exatamente! Repare nos leitos secos de rios e nas rochas por aqui… Quer tentar de novo?'},
  soj3:{en:"That's right! Great job, explorer! Mars really did have liquid water in the past! Scientists found evidence of ancient rivers, lakes, and minerals formed by water.",
        pt:'Isso mesmo! Muito bem, explorador! Marte realmente teve água líquida no passado! Os cientistas encontraram evidências de antigos rios, lagos e minerais formados pela água.'},
  soj4:{en:"I know who can tell you even more about this! My twin brothers Spirit and Opportunity explored these grounds too, and I'm sure they have amazing discoveries to share.",
        pt:'Eu sei quem pode contar ainda mais sobre isso! Meus irmãos gêmeos, Spirit e Opportunity, também exploraram estas terras, e tenho certeza de que eles têm descobertas incríveis para compartilhar.'},
  soj5:{en:'The only problem is… Spirit got stuck in soft sand, and Opportunity was caught in a huge dust storm that covered its solar panels and stopped it from generating enough power. Could you help my siblings so we can hear their stories?',
        pt:'O único problema é que… o Spirit ficou preso na areia fofa, e o Opportunity foi pego por uma enorme tempestade de poeira que cobriu seus painéis solares e o impediu de gerar energia suficiente. Você pode ajudar meus irmãos para ouvirmos suas histórias?'},
  marsGame:{en:'Quick! Click on the passing sandstorms as fast as you can! Fill the energy bar at the top to help save Spirit and Opportunity!',
        pt:'Rápido! Toque nas tempestades de areia que passarem, o mais rápido que puder! Encha a barra de energia no topo para salvar o Spirit e o Opportunity!'},
  soj6:{en:"You did it, congratulations! What a rescue! Thanks to you, Spirit and Opportunity are safe! Well… I hope those two unlucky rovers don't get in trouble again!",
        pt:'Você conseguiu, parabéns! Que resgate! Graças a você, Spirit e Opportunity estão salvos! Bem… espero que esses dois rovers azarados não se metam em encrenca de novo!'},
  oppy1:{en:"Hi, I'm Opportunity, but you can call me Oppy!",pt:'Oi, eu sou o Opportunity, mas pode me chamar de Oppy!'},
  spirit1:{en:"And I'm Spirit! Thank you so much for saving us! You can't imagine how much we've missed rolling across the Martian soil, just like the old days!",

let AC=null,master=null,soundOn=true,musicTimer=null,musicStep=0;
function initAudio(){
  if(AC){AC.resume&&AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=soundOn?0.55:0;master.connect(AC.destination);
  const scale=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
  const pattern=[0,2,4,5,4,2,7,5, 0,3,4,6,4,3,5,2];
  musicTimer=setInterval(()=>{
    if(!soundOn||!AC)return;
    const n=pattern[musicStep%pattern.length];
    tone(scale[n],1.1,'sine',0.035);
    if(musicStep%8===0)tone(scale[n]/2,2.6,'triangle',0.03);
    musicStep++;
  },420);
}
function tone(f,dur,type='sine',vol=0.2,slide=0,delay=0){
  if(!AC)return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);
}
function noise(dur,vol,freq=1000,delay=0){
  if(!AC)return;
  const t0=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);
}
let wind=null;
function windStart(level){
  if(!AC)return;
  if(!wind){
    const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=.8;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.22;lg.gain.value=320;lfo.connect(lg);lg.connect(f.frequency);
    const g=AC.createGain();g.gain.value=0;
    src.connect(f);f.connect(g);g.connect(master);src.start();lfo.start();
    wind={src,lfo,g};
  }
  wind.g.gain.setTargetAtTime(level*2.2,AC.currentTime,.5);
}
function windStop(){if(!wind||!AC)return;const w=wind;wind=null;w.g.gain.setTargetAtTime(0,AC.currentTime,.4);setTimeout(()=>{try{w.src.stop();w.lfo.stop();}catch(_){}},2000);}
function sfx(n){
  if(!AC||!soundOn)return;
  switch(n){
    case 'click':tone(660,.07,'square',.05);break;
    case 'blip':tone(780+Math.random()*160,.03,'square',.018);break;
    case 'jump':tone(320,.28,'sine',.16,380);break;
    case 'collect':[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.14,0,i*.08));break;
    case 'hit':tone(190,.3,'sawtooth',.1,-110);break;
    case 'oops':tone(420,.45,'triangle',.14,-280);break;
    case 'poof':noise(.25,.22,1400);tone(520,.12,'sine',.07,380);break;
    case 'shutter':noise(.06,.45,5000);noise(.08,.35,3000,.09);break;
    case 'rumble':noise(3.4,.32,260);break;
    case 'thud':tone(95,.35,'sine',.3,-45);noise(.35,.18,500);break;
    case 'right':[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.14,0,i*.09));break;
    case 'wrong':tone(300,.22,'square',.06,-60);tone(240,.3,'square',.06,-60,.2);break;
    case 'power':tone(180,.9,'sawtooth',.06,700);tone(360,.9,'sine',.08,900);break;
    case 'gust':noise(.9,.35,700);break;
    case 'dock':tone(140,.25,'square',.12,-40);noise(.2,.2,900);tone(880,.15,'sine',.08,0,.25);break;
    case 'radio':noise(.25,.18,2500);tone(1200,.08,'square',.05,0,.25);tone(1200,.08,'square',.05,0,.38);break;
    case 'win':[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.13,0,i*.12));break;
  }
}

const ease={lin:p=>p,inOut:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,out:p=>1-Math.pow(1-p,3),in:p=>p*p*p};
let tweens=[];
function tween(o,props,dur,e=ease.inOut){
  return new Promise(res=>{const from={};for(const k in props)from[k]=o[k];tweens.push({o,from,to:props,dur,t:0,e,res});});
}
function wait(s){return new Promise(r=>{tweens.push({o:{},from:{},to:{},dur:s,t:0,e:ease.lin,res:r});});}
function updateTweens(dt){
  for(const tw of tweens.slice()){
    tw.t+=dt;const p=Math.min(1,tw.t/tw.dur),v=tw.e(p);
    for(const k in tw.to)tw.o[k]=tw.from[k]+(tw.to[k]-tw.from[k])*v;
    if(p>=1){tweens.splice(tweens.indexOf(tw),1);tw.res();}
  }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

function burst(x,y,n,color,spd=160,life=.8,r=4,g=0){

function updateParts(dt){

const dlg={cur:null};
function openDlg(who,key,acts){
  dlg.cur={who,key,acts,shown:0,blipN:0};
  S.speaker=WHO2ID[who]||null;
  dlgEl.style.display='block';renderDlg();
}
function renderDlg(){
  const c=dlg.cur;if(!c)return;
  whoEl.textContent=c.who?t(c.who):'';whoEl.style.display=c.who?'block':'none';
  txtEl.textContent=t(c.key).slice(0,Math.floor(c.shown));
  actsEl.innerHTML='';
  c.acts.forEach(a=>{
    const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=t(a.k);
    b.onclick=e=>{e.stopPropagation();
      if(a.next&&c.shown<t(c.key).length){c.shown=1e9;txtEl.textContent=t(c.key);return;}
      if(a.keep){sfx('click');a.fn();return;}
      sfx('click');closeDlg();a.fn();};
    actsEl.appendChild(b);
  });
}
function closeDlg(){dlg.cur=null;S.speaker=null;dlgEl.style.display='none';}
function updateDlg(dt){
  const c=dlg.cur;if(!c)return;const full=t(c.key);
  if(c.shown<full.length){
    c.shown+=dt*48;const n=Math.floor(c.shown);txtEl.textContent=full.slice(0,n);
    if(n-c.blipN>=3){c.blipN=n;if(c.who)sfx('blip');}
  }
}
dlgEl.addEventListener('click',()=>{
  const c=dlg.cur;if(!c)return;const full=t(c.key);
  if(c.shown<full.length){c.shown=1e9;txtEl.textContent=full;return;}
  if(c.acts.length===1&&c.acts[0].next){sfx('click');const f=c.acts[0].fn;closeDlg();f();}
});
addEventListener('keydown',e=>{

function ask(who,key,opts){return new Promise(res=>openDlg(who,key,opts.map(o=>({k:o.k,cls:o.cls,fn:()=>res(o.id)}))));}
function photo(capKey){
  return new Promise(res=>{

function clampCam(){const c=S.cam,hw=W/(2*c.z),hh=H/(2*c.z);c.x=clamp(c.x,hw,W-hw);c.y=clamp(c.y,hh,H-hh);}

let camDrag=null;
cv.addEventListener('pointerdown',e=>{if(!S.photoMode)return;camDrag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!camDrag||!S.photoMode)return;
  const r=cv.getBoundingClientRect(),k=W/r.width/S.cam.z;
  S.cam.x-=(e.clientX-camDrag.x)*k;S.cam.y-=(e.clientY-camDrag.y)*k;camDrag={x:e.clientX,y:e.clientY};clampCam();
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>camDrag=null));

addEventListener('keydown',e=>{

/* =========================================================

   ========================================================= */
const SEGS=[[0,520],[650,1100],[1250,1500],[1650,1980],[2140,2500],[2690,2900],[3080,3400],[3580,4140]];
const PLATS=[{x:850,y:340,w:110},{x:1480,y:322,w:110},{x:1985,y:336,w:120},{x:2555,y:345,w:80},{x:2950,y:330,w:90},{x:3250,y:300,w:100},{x:3880,y:320,w:140}];
const BATTERY={x:3950,y:286};
const LEVEL_END=4140;
const keys={l:false,r:false};let jumpQ=false;
function onSeg(x){return SEGS.some(s=>x>=s[0]&&x<=s[1]);}
function groundAt(x){return onSeg(x)?GROUND:null;}
function platformer(){
  return new Promise(res=>{
    S.bg='moon';S.moonSegs=SEGS;S.actors=[];S.camX=0;
    game={type:'plat',p:{x:80,y:GROUND,vx:0,vy:0,on:true,face:1,inv:0,kb:0,coy:0},rocks:[],rockT:2.5,cp:80,res,got:false,msg:null,msgT:0};
    $('#controls').style.display='flex';
  });
}
function updatePlat(g,dt){
  const p=g.p;
  if(g.got){g.gotT-=dt;if(g.gotT<=0){$('#controls').style.display='none';const r=g.res;game=null;S.moonSegs=null;r();}return;}
  const dir=(keys.r?1:0)-(keys.l?1:0);
  if(p.kb>0){p.kb-=dt;}else{p.vx=dir*235;if(dir)p.face=dir;}
  p.vy+=900*dt;
  if(jumpQ&&(p.on||p.coy>0)){p.vy=-525;p.on=false;p.coy=0;sfx('jump');burst(p.x,p.y,6,'#b9b9c0',60,.5,3);}
  jumpQ=false;
  const py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,20,LEVEL_END-20);
  p.on=false;
  if(p.vy>=0){
    if(py<=GROUND+.5&&p.y>=GROUND)for(let i=0;i<SEGS.length;i++){const s=SEGS[i];if(p.x>s[0]-6&&p.x<s[1]+6){p.y=GROUND;p.vy=0;p.on=true;g.cp=Math.max(g.cp,s[0]+40);break;}}
    for(const pl of PLATS)if(p.x>pl.x-6&&p.x<pl.x+pl.w+6&&py<=pl.y+.5&&p.y>=pl.y){p.y=pl.y;p.vy=0;p.on=true;}
  }
  if(p.y>GROUND+3)for(const s of SEGS){if(p.x>s[0]-12&&p.x<s[1]+12){p.x=(p.x<(s[0]+s[1])/2)?s[0]-12:s[1]+12;}}
  p.coy=p.on?.1:p.coy-dt;
  if(p.inv>0)p.inv-=dt;
  if(p.y>H+90){p.x=g.cp;p.y=GROUND-120;p.vy=0;p.vx=0;p.inv=1.4;sfx('oops');g.msg='oops';g.msgT=1.2;}
  S.camX=clamp(p.x-330,0,LEVEL_END-W);
  g.rockT-=dt;
  if(g.rockT<=0&&p.x<BATTERY.x-380){

function sandstorm(spirit,oppy){
  return new Promise(res=>{game={type:'storm',energy:0,storms:[],spawn:.3,res,spirit,oppy,done:false,doneT:0,giant:null};windStart(.1);});
}
function updateStorm(g,dt){
  if(g.done){g.doneT-=dt;if(g.doneT<=0){const r=g.res;game=null;r();}return;}
  if(!g.giant&&g.energy<100){
    g.spawn-=dt;
    if(g.spawn<=0){
      g.spawn=rnd(.42,.8);const left=Math.random()<.5;
      g.storms.push({x:left?-60:W+60,y:rnd(130,360),vx:(left?1:-1)*rnd(240,370),r:rnd(32,44),ph:Math.random()*6,wob:rnd(.8,1.6)});
    }
    if(g.energy>=85){
      g.energy=85;g.giant={x:W+220,y:270,r:160,hp:16,max:16,ph:0};
      sfx('gust');windStart(.4);
    }else g.energy=Math.max(0,g.energy-2*dt);
  }else if(g.giant){
    const G=g.giant;G.ph+=dt*5;G.x+=(480-G.x)*Math.min(1,dt*1.4);G.y=262+Math.sin(time*1.4)*28;
    if(Math.random()<dt*1.5)burst(G.x+rnd(-G.r,G.r),G.y+rnd(-G.r,G.r)*.6,4,'#d9925e',120,.6,5);
  }
  for(const s of g.storms){s.x+=s.vx*dt;s.ph+=dt*9;s.y+=Math.sin(time*s.wob*3)*30*dt;}
  g.storms=g.storms.filter(s=>s.x>-120&&s.x<W+120);
  const e=g.energy/100;
  g.spirit.sink=1-e;g.spirit.dust=.35*(1-e);g.oppy.dust=1-e;
  if(g.energy>=100){g.done=true;g.doneT=1.4;g.storms.forEach(s=>burst(s.x,s.y,12,'#e3a06b',180,.7,5));g.storms=[];sfx('win');windStop();
    g.spirit.sink=0;g.spirit.dust=0;g.oppy.dust=0;g.spirit.sleep=false;g.oppy.sleep=false;
    burst(g.spirit.x,GROUND-60,25,'#ffe27a',200,1,4);burst(g.oppy.x,GROUND-60,25,'#ffe27a',200,1,4);}
}
function drawDustDevil(x,y,r,ph,dark){
  ctx.save();ctx.translate(x,y);
  for(let i=0;i<6;i++){
    const yy=-r+i*r*.38,rx=r*(1-i*.12),off=Math.sin(ph+i)*r*.18;
    ctx.globalAlpha=dark?.7:.55;ellipse(off,yy,rx,r*.2,i%2?(dark?'#b8693c':'#d9925e'):(dark?'#cf8a58':'#e8b07c'));
  }
  ctx.globalAlpha=.9;ctx.strokeStyle=dark?'#8a4a26':'#b8693c';ctx.lineWidth=dark?5:2.5;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,-r*.2+i*r*.35,r*(.7-i*.18),ph+i,ph+i+3.6);ctx.stroke();}
  ctx.restore();ctx.globalAlpha=1;
}
function drawStorm(g){
  if(g.giant){ctx.fillStyle='rgba(190,110,60,.18)';ctx.fillRect(0,0,W,H);}
  for(const s of g.storms)drawDustDevil(s.x,s.y,s.r,s.ph,false);
  if(g.giant){
    const G=g.giant;drawDustDevil(G.x,G.y,G.r,G.ph,true);
    if(Math.floor(time*3)%2===0){ctx.font='bold 26px sans-serif';const tw=ctx.measureText(t('giant')).width;
      rr(W/2-tw/2-18,58,tw+36,42,14,'rgba(120,40,10,.85)');ctx.fillStyle='#ffe2b0';ctx.textAlign='center';ctx.fillText(t('giant'),W/2,88);}
    rr(G.x-60,G.y+G.r*.75,120,10,5,'rgba(0,0,0,.35)');rr(G.x-60,G.y+G.r*.75,120*G.hp/G.max,10,5,'#ffd34d');
  }
  const bw=420,bx=(W-bw)/2,by=16;
  rr(bx-4,by-4,bw+8,34,12,'rgba(20,10,5,.6)');
  rr(bx,by,bw,26,10,'rgba(255,255,255,.15)');
  const gr=ctx.createLinearGradient(bx,0,bx+bw,0);gr.addColorStop(0,'#ffd34d');gr.addColorStop(1,'#7dff9b');
  rr(bx,by,Math.max(20,bw*g.energy/100),26,10,gr);
  ctx.fillStyle='#1b1530';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('⚡ '+t('energy')+' '+Math.floor(g.energy)+'%',W/2,by+18);
}
cv.addEventListener('pointerdown',e=>{
  if(!game||game.type!=='storm'||game.done)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const G=game.giant;
  if(G){
    if(Math.hypot(x-G.x,y-G.y)<G.r*1.15){
      G.hp--;sfx('poof');burst(x,y,14,'#c98a5a',240,.7,6);
      if(G.hp%3===0){S.blur=1;sfx('gust');}
      G.r=80+80*G.hp/G.max;

    }

  for(let i=game.storms.length-1;i>=0;i--){const s=game.storms[i];
    if(Math.hypot(x-s.x,y-s.y)<s.r*1.35){game.storms.splice(i,1);game.energy=Math.min(85,game.energy+5);sfx('poof');burst(s.x,s.y,16,'#e3a06b',200,.7,5);break;}}
});

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000)*(window.__speed||1);last=now;time+=dt;
  updateTweens(dt);
  if(game){if(game.type==='plat')updatePlat(game,dt);else updateStorm(game,dt);}
  updateParts(dt);updateDlg(dt);
  S.flash=Math.max(0,S.flash-dt*2.2);
  if(S.blur>0||cv.style.filter){S.blur=Math.max(0,S.blur-dt*1.6);cv.style.filter=S.blur>0.02?`blur(${(S.blur*7).toFixed(1)}px) sepia(${(S.blur*.7).toFixed(2)})`:'';}
  ctx.save();
  if(S.shake)ctx.translate(rnd(-S.shake,S.shake),rnd(-S.shake,S.shake));
  if(S.cam.z!==1||S.cam.x!==W/2||S.cam.y!==H/2){ctx.translate(W/2,H/2);ctx.scale(S.cam.z,S.cam.z);ctx.translate(-S.cam.x,-S.cam.y);}
  drawBg();
  if(S.orbitDot&&(S.bg==='moon'||S.bg==='mars')){
    const per=11,ph=(time%per)/per,ox=-60+ph*(W+120),oy=250-Math.sin(ph*Math.PI)*40;
    const on=Math.floor(time*3)%2===0;
    ctx.globalAlpha=.35;circle(ox,oy,9,'#fff7c2');ctx.globalAlpha=1;circle(ox,oy,on?3.2:2.2,'#fffbe0');
  }
  if(game&&game.type==='plat'){drawPlat(game);}
  else{
    for(const a of S.actors){
      if(a.alpha===0||a.hidden)continue;
      ctx.globalAlpha=a.alpha===undefined?1:a.alpha;
      if(a.id&&a.id===S.speaker){const b=a.bob;a.bob=(b||0)-Math.abs(Math.sin(time*9))*3;DRAW[a.type](a);a.bob=b;}
      else DRAW[a.type](a);
      ctx.globalAlpha=1;
    }
    if(game&&game.type==='storm')drawStorm(game);
  }
  drawParts();
  if(S.radio&&S.actors.includes(rocket)){
    const tx=rocket.x-S.camX+22*rocket.s,ty=rocket.y-110*rocket.s;
    ctx.strokeStyle='rgba(255,230,120,.9)';ctx.lineWidth=3;
    for(let i=0;i<3;i++){const r=((time*40+i*16)%48)+8;ctx.globalAlpha=1-r/56;ctx.beginPath();ctx.arc(tx,ty,r,-.9,.9);ctx.stroke();}
    ctx.globalAlpha=1;
  }
  if(S.bg==='table')drawPolaroids();
  if(S.banner){
    ctx.font='bold 30px sans-serif';const tw=ctx.measureText(t(S.banner)).width;
    rr(W/2-tw/2-26,222,tw+52,64,18,'rgba(255,255,255,.93)','#ffd34d',4);
    ctx.fillStyle='#1b1530';ctx.textAlign='center';ctx.fillText(t(S.banner),W/2,265);
  }
  ctx.restore();
  if(captureCb){
    const off=document.createElement('canvas');off.width=480;off.height=270;off.getContext('2d').drawImage(cv,0,0,480,270);
    const img=new Image();img.src=off.toDataURL('image/jpeg',.85);const cb=captureCb;captureCb=null;cb(img);
  }
  if(S.viewfinder){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;const m=40,L=46;
    [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y);ctx.stroke();});
    if(Math.floor(time*2)%2===0)circle(m+22,m+22,7,'#ff4d4d');
    ctx.fillStyle='rgba(255,255,255,.95)';ctx.font='bold 20px sans-serif';ctx.textAlign='right';ctx.fillText('🔍 '+S.cam.z.toFixed(2).replace(/0$/,'')+'×',W-56,H-52);
    ctx.textAlign='left';ctx.font='15px sans-serif';ctx.fillText('✋ ↔ ↕',56,H-52);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-16,H/2);ctx.lineTo(W/2+16,H/2);ctx.moveTo(W/2,H/2-16);ctx.lineTo(W/2,H/2+16);ctx.stroke();
  }
  if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash})`;ctx.fillRect(0,0,W,H);}
  if(S.fade>0){ctx.fillStyle=`rgba(0,0,0,${S.fade})`;ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}

let albumImgs=null,albumOpen=null,albumIdx=0;
function renderAlbumImgs(){
  if(albumImgs)return;
  albumImgs={};
  const saved=ctx,sv={bg:S.bg,camX:S.camX,moonSegs:S.moonSegs,planet:S.planet};
  for(const e of ALBUM){
    const off=document.createElement('canvas');off.width=640;off.height=360;
    ctx=off.getContext('2d');ctx.setTransform(640/W,0,0,360/H,0,0);
    try{e.draw();}catch(err){console.error(e.id,err);}
    albumImgs[e.id]=off.toDataURL('image/jpeg',.85);
  }
  ctx=saved;Object.assign(S,sv);
}
const VISIT_CAP={lrv:'capLRV',eagle:'capEagle',soj:'capMars',mer:'capMars'};
function playerPhoto(e){if(!e.visit)return null;const p=photos.find(p=>p.cap===VISIT_CAP[e.visit]);return p?p.img.src:null;}
function buildAlbum(){
  const el=$('#album');
  let h=`<div class="ahead"><div><h2>${t('albumTitle')}</h2><p>${t('albumSub')}</p></div>
    <div class="abtns"><button class="btn ghost" id="aLang">${t('langBtn')}</button><button class="btn" id="aClose">${t('close')}</button></div></div>`;
  for(const g of ['moon','mars','deep']){
    h+=`<h3>${t('g'+g)}</h3><div class="agrid">`;
    ALBUM.forEach((e,i)=>{if(e.group!==g)return;
      const ph=playerPhoto(e);h+=`<button class="pol" data-i="${i}" style="--r:${[-2.5,1.8,-1.2,2.6,-.6][i%5]}deg">${ph?`<em>${t('visited')}</em>`:''}<img src="${ph||albumImgs[e.id]}" alt="${e.name}"><span>${e.name}<small>${t('more')}</small></span></button>`;});
    h+='</div>';
  }
  el.innerHTML=h;
  el.querySelectorAll('.pol[data-i]').forEach(b=>b.onclick=()=>{sfx('click');showAlbumItem(+b.dataset.i);});
  $('#aClose').onclick=closeAlbum;
  $('#aLang').onclick=()=>{lang=lang==='en'?'pt':'en';refreshTexts();buildAlbum();sfx('click');};
}
function showAlbumItem(i){
  albumIdx=(i+ALBUM.length)%ALBUM.length;const e=ALBUM[albumIdx],ph=playerPhoto(e);
  const d=$('#albumDetail');
  d.innerHTML=`<div class="dcard">
    <div class="dtop"><button class="btn ghost" id="dBack">${t('back')}</button>
      <div class="nav"><button class="btn ghost" id="dPrev">◀</button><span>${albumIdx+1} / ${ALBUM.length}</span><button class="btn ghost" id="dNext">▶</button></div></div>
    <div class="pol big"><img src="${ph||albumImgs[e.id]}" alt="${e.name}"><span>${e.name}</span></div>
    <h2>${e.name}${ph?` <em>${t('visited')}</em>`:''}</h2>
    <div class="chips"><b>🗓️ ${e.when[lang]}</b><b>📍 ${e.where[lang]}</b><b>💤 ${e.status[lang]}</b></div>
    <p>${e.text[lang]}</p>
    <a href="${e.src}" target="_blank" rel="noopener">🔗 ${t('source')} · ${e.src.replace('https://','').split('/')[0]}</a>
  </div>`;
  d.style.display='flex';d.scrollTop=0;
  $('#dBack').onclick=()=>{sfx('click');d.style.display='none';};
  $('#dPrev').onclick=()=>{sfx('click');showAlbumItem(albumIdx-1);};
  $('#dNext').onclick=()=>{sfx('click');showAlbumItem(albumIdx+1);};
}
function openAlbum(){
  return new Promise(res=>{
    renderAlbumImgs();buildAlbum();albumOpen=res;
    $('#album').style.display='block';$('#album').scrollTop=0;$('#albumDetail').style.display='none';
    const ai=$('#albumIntro');
    ai.innerHTML=`<div class="icard"><div class="ipol"><img src="${albumImgs.pathfinder}" alt=""><img src="${albumImgs.eagle}" alt=""><img src="${albumImgs.pioneer}" alt=""></div>
      <h2>${t('introTitle')}</h2><p>${t('introText')}</p><button class="btn big" id="introOk">${t('introOk')}</button></div>`;
    ai.style.display='flex';
    $('#introOk').onclick=()=>{sfx('click');ai.style.display='none';};
  });
}
function closeAlbum(){
  sfx('click');$('#album').style.display='none';$('#albumDetail').style.display='none';$('#albumIntro').style.display='none';
  if(albumOpen){const r=albumOpen;albumOpen=null;r();}
}
addEventListener('keydown',e=>{
  if($('#album').style.display!=='block')return;
  if($('#albumIntro').style.display==='flex'){if(e.key==='Escape'||e.key==='Enter')$('#albumIntro').style.display='none';return;}
  if(e.key==='Escape'){if($('#albumDetail').style.display==='flex')$('#albumDetail').style.display='none';else closeAlbum();}
  if($('#albumDetail').style.display==='flex'){if(e.key==='ArrowRight')showAlbumItem(albumIdx+1);if(e.key==='ArrowLeft')showAlbumItem(albumIdx-1);}
});

  ctx.fillStyle='#c9ccd3';ctx.beginPath();ctx.moveTo(2,-18);ctx.lineTo(36,-5);ctx.lineTo(36,5);ctx.lineTo(2,18);ctx.closePath();ctx.fill();

}

    drawCSM(700,185,1.6,.32);
    drawEagle({x:330,y:396,s:.75,noBlink:1});
    drawAstro({x:236,y:400,s:.7,facing:1,noBlink:1});drawAstro({x:420,y:404,s:.7,facing:-1,noBlink:1,wave:false});
    ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    const lab=(txt,x,y)=>{const w=ctx.measureText(txt).width;rr(x-w/2-12,y-24,w+24,34,10,'rgba(10,12,35,.85)','#6fd3ff',2);ctx.fillStyle='#fff';ctx.fillText(txt,x,y);};
    lab(t('apOrbit'),660,92);lab(t('apSurface'),330,488);
  }catch(e){console.error(e);}
  ctx=saved;
  return off.toDataURL('image/jpeg',.88);
}
function showApollo(){
  const m=$('#apollo');
  m.innerHTML=`<div class="acard"><img src="${renderApolloImg()}" alt="">
    <h2>📖 ${t('apTitle')}</h2><p>${t('apText')}</p>
    <div class="afoot"><a href="https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1969-059C" target="_blank" rel="noopener">🔗 ${t('apSrc')}</a>
    <button class="btn" id="apOk">${t('apOk')}</button></div></div>`;
  m.style.display='flex';m.scrollTop=0;
  $('#apOk').onclick=e=>{e.stopPropagation();sfx('click');m.style.display='none';};
}
addEventListener('keydown',e=>{if($('#apollo').style.display==='flex'&&(e.key==='Escape'||e.key==='Enter')){e.stopImmediatePropagation();$('#apollo').style.display='none';}},true);

/* =========================================================
   TITLE BUTTONS
   ========================================================= */
document.querySelectorAll('.sndBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();soundOn=!soundOn;initAudio();if(master)master.gain.value=soundOn?.55:0;refreshTexts();sfx('click');});
document.querySelectorAll('.langBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();lang=lang==='en'?'pt':'en';refreshTexts();sfx('click');});
$('#startBtn').onclick=async()=>{
  initAudio();sfx('click');
  await tween(S,{fade:1},.5);
  $('#title').style.display='none';$('#toggles').style.display='flex';
  run();
};
$('#albumBtn').onclick=e=>{e.stopPropagation();sfx('click');openAlbum();};
refreshTexts();
</script>
